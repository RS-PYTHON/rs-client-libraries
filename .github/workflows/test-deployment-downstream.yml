name: Test downstream deployments

# Run workflow only for ...
on:
  pull_request: # pull requests
    types: [opened, synchronize, reopened]
    branches:
      - '!feat/prepare-new-release'
  push:
    branches: [develop, main] # pushes on the 'develop' or 'main' branches
    # run this worflow only for rs_workflows code related changes
    paths: ['rs_workflows/**.py', '**.toml', 'install.sh']
  workflow_dispatch: # manual trigger

env:
  # Current branch name (or source branch for a pull request) or git tag (if we are pushing a git tag)
  BRANCH_NAME: ${{ case(github.event_name == 'pull_request', github.event.pull_request.head.ref, github.ref_name) }}

jobs:
  test-deploy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repo: ['rs-workflow-deployment']
    steps:
      - name: Check if branch exists in ${{ matrix.repo }}
        id: check_branch
        uses: RS-PYTHON/actions/.github/actions/get-repo-branch@develop
        with:
          repo: RS-PYTHON/${{ matrix.repo }}
          # Try current branch, then develop
          branches: ${{ env.BRANCH_NAME }},develop
      - name: Trigger deployment of ${{ matrix.repo }}
        uses: benc-uk/workflow-dispatch@ba9b031f598534deb29873396ef7b0acf17aa94a
        with:
          workflow: test-deployment.yml
          repo: RS-PYTHON/${{ matrix.repo }}
          ref: ${{ steps.check_branch.outputs.branch }}
          inputs: '{ "infra_core_ref": "${{ env.BRANCH_NAME }}"}'
          token: '${{ secrets.TRIGGER_WORKFLOWS }}'
          wait-for-completion: true
          wait-timeout-seconds: 3600
          sync-status: true
