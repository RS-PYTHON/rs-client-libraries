name: Benchmark processor

on:
  workflow_dispatch: # manual trigger only
    inputs:
      cluster:
        description: Cluster
        required: true
        type: choice
        default: dev # CHANGE TO OPS
        options:
          - ops
          - dev
      processor:
        description: Processor
        required: true
        type: choice
        options: # same as in rs-client-libraries/rs_client/ogcapi/dpr_client.py:DprProcessor
          - s1_l0
          - s3_l0
          - s1_ard
          - s3_l1olci

jobs:
  main:
    name: Benchmark processor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: run
        env:
          PYTHONPATH: ${{ '.github/scripts:env.PYTHONPATH' }}
          CONFIG: ${{ case(github.event.inputs.cluster == 'dev', 'PREFECT_CONFIG_DEV', 'PREFECT_CONFIG_OPS') }}
          CREDENTIALS: ${{ case(github.event.inputs.cluster == 'dev', 'PREFECT_CREDENTIALS_DEV', 'PREFECT_CREDENTIALS_OPS') }}
        run: |
          import os

          print("Read configuration from github variable: '${{env.CONFIG}}'")
          config = """${{ vars[env.CONFIG] }}"""

          print("Read credentials from github secret: '${{env.CREDENTIALS}}'")
          credentials = """${{ secrets[env.CREDENTIALS] }}"""

          from call_prefect import *
          read_access_token(config, credentials)

        shell: python
