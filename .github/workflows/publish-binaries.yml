name: Publish wheels and Docker images

# Run workflow only for ...
on:
  pull_request: # pull requests
    types: [opened, synchronize, reopened]
  push:
    branches: [develop, main] # pushes on the 'develop' or 'main' branches
    tags: ['**'] # new git tags (including hierarchical tags like v1.0/beta)
  workflow_dispatch: # manual trigger
    inputs:
      docker_tag:
        description: Add this tag to the docker images as e.g. 'latest' or 'feat-rspy123'
        required: false

env:
  DOCKER_REGISTRY: ghcr.io

jobs:
  build-wheel:
    name: Build wheel
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]' # ignore pull requests by github bot
    outputs:
      version_name: ${{ steps.build-wheel.outputs.version_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # so that Dunamai produce the correct version
      - id: build-wheel
        uses: RS-PYTHON/actions/.github/actions/build-wheel@develop
        with:
          package_directory: .

  set-binary-env:
    name: Set Docker environment
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    needs: build-wheel
    outputs:
      branch_name: ${{ steps.set-binary-env.outputs.branch_name }}
      docker_tags: ${{ steps.set-binary-env.outputs.docker_tags }}
      docker_final_tags: ${{ steps.set-binary-env.outputs.docker_final_tags }}
      first_tag: ${{ steps.first-tag.outputs.value }}
    steps:
      - id: set-binary-env
        name: Call action 'set-binary-env'
        uses: RS-PYTHON/actions/.github/actions/set-binary-env@develop
        with:
          wheel_version_name: ${{ needs.build-wheel.outputs.version_name }}
          manual_tag: ${{ github.event.inputs.docker_tag }}
      - name: First docker tag
        id: first-tag
        run: |
          set -x
          # Keep the first image tag from a list as tag1,tag2,tag3
          value=$(echo ${{ steps.set-binary-env.outputs.docker_tags }} | cut -d , -f1)
          echo "value=$value" >> $GITHUB_OUTPUT

  publish-docker-images:
    name: "Build and publish Docker images"
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    needs: set-binary-env
    permissions:
      security-events: write # needed for github/codeql-action/upload-sarif
      packages: write # needed for 'docker push'
    strategy:
      matrix:
        image:
          - jupyter
          - prefect-local
          - prefect-k8s

        # Options specific to each image, from the publish-docker action.
        include:
          - image: jupyter # Local jupyter image with rs-client-libraries
            dockerfile: ./.github/dockerfiles/Dockerfile.jupyter
            image_suffix: jupyter/rs-client-libraries/local
            build_args: "BASE_TAG=${{ needs.set-binary-env.outputs.first_tag }}"

          - image: prefect-local # Local prefect image with rs-client-libraries
            dockerfile: ./.github/dockerfiles/Dockerfile.prefect
            image_suffix: prefect/rs-client-libraries/local
            build_args: "K8S_IMAGE="
          - image: prefect-k8s # Prefect image for kubernetes with rs-client-libraries.
            dockerfile: ./.github/dockerfiles/Dockerfile.prefect
            image_suffix: prefect/rs-client-libraries/k8s
            build_args: "K8S_IMAGE=-k8s"

    steps:
      - uses: actions/checkout@v6
      - name: Download .whl dependency
        uses: actions/download-artifact@v8
        with:
          pattern: rs_client_libraries-*.whl
          path: ./build_context_path
      - name: Copy Dockerfile requirements
        run: cp -t ./build_context_path ./.github/scripts/layer-cleanup.sh ./.github/scripts/restore-apt.sh
      - run: ls ./build_context_path
      - id: publish-docker
        uses: RS-PYTHON/actions/.github/actions/publish-docker@develop
        with:
          dockerfile: ${{ matrix.dockerfile }}
          build_context_path: ./build_context_path
          image_basename: ${{ github.repository_owner }}/
          image_suffix: ${{ matrix.image_suffix }}
          image_tags: ${{ needs.set-binary-env.outputs.docker_tags }}
          dockerhub_username: ${{ vars.DOCKERHUB_USERNAME }}
          dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          build_args: ${{ matrix.build_args }}
      - uses: cloudposse/github-action-matrix-outputs-write@81ea135d4c4f90a5220bb38304380073c571dbb8
        with:
          matrix-step-name: publish-docker-images
          matrix-key: ${{ matrix.image }}
          outputs: |
            docker_images: ${{ steps.publish-docker.outputs.docker_images }}

  get-pushed-images:
    name: Get pushed Docker image names
    needs: [set-binary-env, publish-docker-images]
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    outputs:
      pushed_images: ${{ steps.read.outputs.pushed_images }}
    steps:
      - id: read-matrix-outputs
        if: ${{ needs.set-binary-env.outputs.docker_final_tags != '' }} # only if a temp Docker tag has been set
        uses: cloudposse/github-action-matrix-outputs-read@ddb62566e896c85614f5eeec2daa43d6d1dc6cb0
        with:
            matrix-step-name: publish-docker-images
      - id: read
        if: ${{ needs.set-binary-env.outputs.docker_final_tags != '' }}
        run: |
          set -x
          # Docker images that have been pushed
          # e.g. {"docker_images": {"jupyter": "<jupyter_image>", "prefect": "<prefect_image>" }}
          json_images='${{ steps.read-matrix-outputs.outputs.result }}' # use simple quotes, not double quotes !
          pushed_images=$(echo "$json_images" | jq -r .docker_images[] | paste -sd,) # separate values with ','

          echo pushed_images="$pushed_images" >> "$GITHUB_OUTPUT"

  # Test rs-demo with the new Docker images
  test-demo:
    name: Test rs-demo
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    needs: [set-binary-env, publish-docker-images, get-pushed-images]
    permissions:
      packages: write # needed for 'docker push'
    steps:
      - name: Log into Docker registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Test rs-demo
        env:
          BRANCH_NAME: ${{ needs.set-binary-env.outputs.branch_name }}
          DOCKER_TAGS: ${{ needs.set-binary-env.outputs.docker_tags }}
        run: |
          set -x

          # Keep last tag (after the last ',')
          export DOCKER_TAG=${DOCKER_TAGS##*,}

          # Clone the rs-demo repository
          git clone https://github.com/RS-PYTHON/rs-demo.git
          cd rs-demo

          # Run the rs-demo local mode using the newly created docker images
          ./test-rs-demo.sh

      - name: Upload executed notebooks
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: notebook-outputs
          path: local-mode/notebook-outputs/
          if-no-files-found: ignore

      # If we used a temp docker tag, and only if the tests succeeded, then
      # we tag the images with the real tags and push them.
      - name: Tag and push Docker images
        if: ${{ needs.set-binary-env.outputs.docker_final_tags != '' }}
        uses: RS-PYTHON/actions/.github/actions/tag-push-docker@develop
        with:
          old_docker_images: ${{ needs.get-pushed-images.outputs.pushed_images }}
          new_tags: ${{ needs.set-binary-env.outputs.docker_final_tags }}

  publish-wheels-pypi:
    name: "Publish wheels and sdists to PyPI"
    if: (github.actor != 'dependabot[bot]') && (github.event_name == 'push') && startsWith(github.ref, 'refs/tags')
    runs-on: ubuntu-latest
    needs: [test-demo] # only if the tests succeeded
    permissions:
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing
    steps:
      - name: Download dist dependencies
        uses: actions/download-artifact@v8
        with:
          pattern: "*.{whl,tar.gz}"
          path: ./dist
          merge-multiple: true
      - name: Publish wheel and sdist packages
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b
        with:
          skip-existing: true
          packages-dir: ./dist
          verbose: true
