name: Publish wheels and Docker images

# Run workflow only for ...
on:
  pull_request: # pull requests
    types: [opened, synchronize, reopened]
  push:
    branches: [develop, main] # pushes on the 'develop' or 'main' branches
    tags: ['**'] # new git tags (including hierarchical tags like v1.0/beta)
  workflow_dispatch: # manual trigger
    inputs:
      called_by:
        type: choice
        options:
          - rs-client-libraries
          - rebuild-base-jupyter # called by rs-workflow-env after rebuilding the base jupyter image
        default: rs-client-libraries
      caller_name:
        description: Caller name, to be displayed in the info job name
        required: false
      caller_url:
        description: Caller url, to be displayed in the info job details
        required: false
      caller_reason:
        description: Why this run was called, to be displayed in the info job details
        required: false
      add_docker_tags:
        description: Add these tags to the docker images as e.g. 'custom-tag1,custom-tag-2'
        required: false
      force_docker_tags:
        description: If set, force these docker tags (used when called from other repository)
        required: false
      force_docker_final_tags:
        description: If set, force these final docker tags (used when called from other repository)
        required: false

env:
  DOCKER_REGISTRY: ghcr.io

jobs:
  info:
    runs-on: ubuntu-latest
    name: "Triggered by: ${{ inputs.caller_name }}"
    env:
      CALLER_URL: ${{ inputs.caller_url }}
      CALLER_REASON: ${{ inputs.caller_reason }}
    steps:
    - if: ${{ inputs.caller_name != '' }}
      run: >
        echo
        ":information_source: <br>
        This run has been triggered by: ${CALLER_URL}<br>
        Reason: ${CALLER_REASON}"
        >> $GITHUB_STEP_SUMMARY

  # The integration tests are skipped only for the Dependabot pull requests that update GitHub Actions or
  # development dependencies. The other updates can break them with side effects that pytest does not see.
  need-integration-tests:
    name: Check if the integration tests are needed
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # to read the Dependabot metadata
    outputs:
      needed: ${{ steps.check.outputs.needed }}
    steps:
      - id: check
        uses: RS-PYTHON/actions/.github/actions/need-integration-tests@develop

  build-wheel:
    name: Build wheel
    runs-on: ubuntu-latest
    needs: need-integration-tests
    if: needs.need-integration-tests.outputs.needed == 'true'
    outputs:
      version_name: ${{ steps.build-wheel.outputs.version_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # so that Dunamai produce the correct version
      - id: build-wheel
        uses: RS-PYTHON/actions/.github/actions/build-wheel@develop
        with:
          package_directory: .

  set-binary-env:
    name: Set Docker environment
    runs-on: ubuntu-latest
    needs: build-wheel
    outputs:
      branch_name: ${{ steps.set-binary-env.outputs.branch_name }}
      docker_tags: ${{ steps.set-binary-env.outputs.docker_tags }}
      docker_final_tags: ${{ steps.set-binary-env.outputs.docker_final_tags }}
      base_jupyter_tag: ${{ steps.base-jupyter-tag.outputs.tag }}
    steps:
      - id: set-binary-env
        name: Call action 'set-binary-env'
        uses: RS-PYTHON/actions/.github/actions/set-binary-env@develop
        with:
          wheel_version_name: ${{ needs.build-wheel.outputs.version_name }}
          add_docker_tags: ${{ inputs.add_docker_tags }}
          force_docker_tags: ${{ inputs.force_docker_tags }}
          force_docker_final_tags: ${{ inputs.force_docker_final_tags }}

      - id: base-jupyter-tag
        name: Resolve base jupyter image tag
        uses: RS-PYTHON/actions/.github/actions/get-image-tag@develop
        with:
          image: ghcr.io/rs-python/quay.io/jupyter/base-notebook
          # Test image tags with the same name as current branch, else latest
          tags: ${{ steps.set-binary-env.outputs.docker_tags }},latest

  publish-docker-images:
    name: "Build and publish Docker images"
    runs-on: ubuntu-latest
    needs: set-binary-env
    permissions:
      security-events: write # needed for github/codeql-action/upload-sarif
      packages: write # needed for 'docker push'
    strategy:
      matrix:
        image:
          - jupyter
          - prefect-local
          - prefect-k8s

        # Options specific to each image, from the publish-docker action.
        include:
          - image: jupyter # Local jupyter image with rs-client-libraries
            # If called by rs-client-libraries or after rebuilding the base jupyter image
            if: ${{ contains('rs-client-libraries,rebuild-base-jupyter', inputs.called_by) }}
            dockerfile: ./.github/dockerfiles/Dockerfile.jupyter
            image_suffix: jupyter/rs-client-libraries/local
            build_args: "BASE_TAG=${{ needs.set-binary-env.outputs.base_jupyter_tag }}"

          - image: prefect-local # Local prefect image with rs-client-libraries
            if: ${{ contains('rs-client-libraries', inputs.called_by) }} # If called by rs-client-libraries
            dockerfile: ./.github/dockerfiles/Dockerfile.prefect
            image_suffix: prefect/rs-client-libraries/local
            build_args: "K8S_IMAGE="

          - image: prefect-k8s # Prefect image for kubernetes with rs-client-libraries.
            if: ${{ contains('rs-client-libraries', inputs.called_by) }} # If called by rs-client-libraries
            dockerfile: ./.github/dockerfiles/Dockerfile.prefect
            image_suffix: prefect/rs-client-libraries/k8s
            build_args: "K8S_IMAGE=-k8s"

    steps:
      - if: ${{ matrix.if }}
        uses: actions/checkout@v7
      - if: ${{ matrix.if }}
        name: Download .whl dependency
        uses: actions/download-artifact@v8
        with:
          pattern: rs_client_libraries-*.whl
          path: ./build_context_path
      - if: ${{ matrix.if }}
        name: Copy Dockerfile requirements
        run: cp -t ./build_context_path ./.github/scripts/layer-cleanup.sh ./.github/scripts/restore-apt.sh
      - if: ${{ matrix.if }}
        run: ls ./build_context_path
      - if: ${{ matrix.if }}
        id: publish-docker
        uses: RS-PYTHON/actions/.github/actions/publish-docker@develop
        with:
          dockerfile: ${{ matrix.dockerfile }}
          build_context_path: ./build_context_path
          image_basename: ${{ github.repository_owner }}/
          image_suffix: ${{ matrix.image_suffix }}
          image_tags: ${{ needs.set-binary-env.outputs.docker_tags }}
          dockerhub_username: ${{ vars.DOCKERHUB_USERNAME }}
          dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          build_args: ${{ matrix.build_args }}

  # Test rs-demo with the new Docker images
  test-demo:
    name: Test rs-demo
    runs-on: ubuntu-latest
    needs: [set-binary-env, publish-docker-images]
    permissions:
      packages: write # needed for 'docker push'
      pull-requests: write # to report the notebooks in the pull request
    steps:
      - name: Log into Docker registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Test rs-demo
        id: test-demo
        env:
          BRANCH_NAME: ${{ needs.set-binary-env.outputs.branch_name }}
          DOCKER_TAGS: ${{ needs.set-binary-env.outputs.docker_tags }}
        run: |
          set -x

          # Keep last tag (after the last ',')
          export DOCKER_TAG=${DOCKER_TAGS##*,}

          # Clone the rs-demo repository
          git clone https://github.com/RS-PYTHON/rs-demo.git
          cd rs-demo

          # Run the rs-demo local mode using the newly created docker images
          ./test-rs-demo.sh

      - name: Upload executed notebooks
        id: upload-notebooks
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: notebook-outputs
          path: rs-demo/local-mode/notebook-outputs/
          if-no-files-found: warn

      - name: Report the notebooks in the pull request
        if: ${{ !cancelled() }}
        continue-on-error: true # the report must never fail the job
        uses: RS-PYTHON/actions/.github/actions/report-notebooks@develop
        with:
          notebooks-dir: rs-demo/local-mode/notebook-outputs
          outcome: ${{ steps.test-demo.outcome }}
          artifact-url: ${{ steps.upload-notebooks.outputs.artifact-url }}

      # If we used a temp docker tag, and only if the tests succeeded, then
      # we tag the images with the real tags and push them.
      - name: Tag and push Docker images
        if: ${{ needs.set-binary-env.outputs.docker_final_tags != '' }}
        uses: RS-PYTHON/actions/.github/actions/tag-push-docker@develop
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          new_tags: ${{ needs.set-binary-env.outputs.docker_final_tags }}

  publish-wheels-pypi:
    name: "Publish wheels and sdists to PyPI"
    if: (github.event_name == 'push') && startsWith(github.ref, 'refs/tags')
    runs-on: ubuntu-latest
    needs: [test-demo] # only if the tests succeeded
    permissions:
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing
    steps:
      - name: Download dist dependencies
        uses: actions/download-artifact@v8
        with:
          pattern: "*.{whl,tar.gz}"
          path: ./dist
          merge-multiple: true
      - name: Publish wheel and sdist packages
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
        with:
          skip-existing: true
          packages-dir: ./dist
          verbose: true

  trigger-rs-workflow-env:
    runs-on: ubuntu-latest
    name: Trigger rs-workflow-env # to build the jupyter image for cluster mode with the latest rs-client-libraries changes
    if: (github.event_name == 'push') && (github.ref_name == 'develop') # Only when we push to develop
    steps:
      - name: Trigger rs-workflow-env
        # Link to the URL of this current github actions run
        env:
          THIS_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        uses: benc-uk/workflow-dispatch@78e99d70d9acaa4e2c98fe781b3cabda5df0228e
        with:
          workflow: build-jupyter.yml
          repo: RS-PYTHON/rs-workflow-env
          ref: develop
          inputs: '{
            "build_base_image": false,
            "caller_name": "rs-client-libraries",
            "caller_url": "${{ env.THIS_URL }}",
            "caller_reason": "Build the Jupyter image for cluster mode with the latest rs-client-libraries."
            }'
          token: '${{ secrets.TRIGGER_WORKFLOWS }}'
          wait-for-completion: true
          wait-timeout-seconds: 3600
          sync-status: true
