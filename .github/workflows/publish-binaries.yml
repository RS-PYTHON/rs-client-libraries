name: Publish wheels and Docker images

# Run workflow only for ...
on:
  pull_request: # pull requests
    types: [opened, synchronize, reopened]
  push:
    branches:
      - develop # pushes on the 'develop' branch
    tags:
      - '**' # new git tags (including hierarchical tags like v1.0/beta)
  workflow_dispatch: # manual trigger
    inputs:
      docker_tag:
        description: Tag the docker images as e.g. 'latest' or 'feat-rspy123'
        required: false

env:
  PYTHON_VERSION: 3.13.11
  DOCKER_REGISTRY: ghcr.io

jobs:

  # Calculate variables for this workflow
  set-env:
    if: github.actor != 'dependabot[bot]' # ignore pull requests by github bot
    runs-on: ubuntu-latest
    name: "Set environment"
    outputs:
      docker_tag: ${{ steps.set-env.outputs.docker_tag }}
      branch_name: ${{ steps.set-env.outputs.branch_name }}
    steps:
      - id: set-env
        name: "Set environment"
        run: |
          set -x

          # Get the current branch name (or source branch for a pull request)
          if [[ ${{ github.event_name }} == pull_request ]]; then
            branch_name=${{ github.event.pull_request.head.ref }}
          else
            branch_name=${{ github.ref_name }}
          fi

          # Determine the docker tag to set to new docker images.
          # For a pull request, use the branch name
          if [[ ${{ github.event_name }} == pull_request ]]; then
            docker_tag="$branch_name"

          # For a push on develop or a tag, use the docker tag :latest
          elif [[ ${{ github.event_name }} == push ]]; then
            docker_tag=latest

          # For a manual trigger, use the user-defined tag
          elif [[ ${{ github.event_name }} == workflow_dispatch ]]; then
            docker_tag=${{ github.event.inputs.docker_tag }}

          else
            >&2 echo "Unknown trigger"
            exit 1
          fi

          # Replace special characters by -
          docker_tag=$(sed "s/[^a-zA-Z0-9]/-/g" <<< "$docker_tag")

          # Save values
          echo "branch_name=$branch_name" >> $GITHUB_OUTPUT
          echo "docker_tag=$docker_tag" >> $GITHUB_OUTPUT
        shell: bash

  ################
  # Build wheels #
  ################

  build-whl:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    name: "Build wheel"
    outputs:
      version_name: ${{ steps.build-wheel.outputs.version_name }}
      package_name: ${{ steps.build-wheel.outputs.package_name }}
      sdist_name: ${{ steps.build-wheel.outputs.sdist_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # so that Dunamai produce the correct version
      - id: build-wheel
        uses: ./.github/actions/build-wheel
        with:
          package_directory: .

  ###################
  # Publish to PyPI #
  ###################

  publish-pypi:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    name: "Publish wheel and sdist"
    needs: [build-whl]
    permissions:
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing
    steps:
      - name: Download dist dependencies
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: ./dist
      - name: Publish wheel and sdist packages
        uses: pypa/gh-action-pypi-publish@release/v1
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
        with:
          skip-existing: true
          packages-dir: ./dist
          verbose: true


  #########################
  # Publish Docker images #
  #########################

  # Local jupyter image with rs-client-libraries
  publish-docker-jupyter:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    name: "Docker image for Jupyter"
    needs: [set-env, build-whl]
    permissions: write-all
    outputs:
      docker_image: ${{ steps.publish-docker.outputs.docker_image}}
    steps:
      - uses: actions/checkout@v6

      # Download .whl files into ./whl/
      - name: Download .whl dependencies
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-whl.outputs.package_name }}
          path: ./whl

      - name: Copy Dockerfile requirements
        run: cp -t ./whl ./.github/scripts/layer-cleanup.sh ./.github/scripts/restore-apt.sh
        shell: bash

      - id: publish-docker
        uses: ./.github/actions/publish-docker
        with:
          dockerfile: ./.github/dockerfiles/Dockerfile.jupyter
          build_context_path: ./whl
          image_basename: "${{ github.repository_owner }}/jupyter"
          image_suffix: /rs-client-libraries/local
          version_name: ${{ needs.build-whl.outputs.version_name }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          docker_tag: ${{ needs.set-env.outputs.docker_tag }}

  # Local prefect image with rs-client-libraries
  publish-docker-prefect-local:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    name: "Docker image for Prefect in local mode"
    needs: [set-env, build-whl]
    permissions: write-all
    outputs:
      docker_image: ${{ steps.publish-docker.outputs.docker_image}}
    steps:
      - uses: actions/checkout@v6

      # Download .whl files into ./whl/
      - name: Download .whl dependencies
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-whl.outputs.package_name }}
          path: ./whl

      - name: Copy layer-cleanup.sh script
        run: cp -t ./whl ./.github/scripts/layer-cleanup.sh
        shell: bash

      - id: publish-docker
        uses: ./.github/actions/publish-docker
        with:
          dockerfile: ./.github/dockerfiles/Dockerfile.prefect
          build_context_path: ./whl
          image_basename: "${{ github.repository_owner }}/prefect"
          image_suffix: /rs-client-libraries/local
          version_name: ${{ needs.build-whl.outputs.version_name }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          docker_tag: ${{ needs.set-env.outputs.docker_tag }}
          build_args: |
            K8S_IMAGE=

  # Prefect image for kubernetes with rs-client-libraries.
  publish-docker-prefect-k8s:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    name: "Docker image for Prefect in k8s"
    needs: [set-env, build-whl]
    permissions: write-all
    outputs:
      docker_image: ${{ steps.publish-docker.outputs.docker_image}}
    steps:
      - uses: actions/checkout@v6

      # Download .whl files into ./whl/
      - name: Download .whl dependencies
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-whl.outputs.package_name }}
          path: ./whl

      - name: Copy Dockerfile requirements
        run: cp -t ./whl ./.github/scripts/layer-cleanup.sh ./.github/scripts/restore-apt.sh
        shell: bash

      - id: publish-docker
        uses: ./.github/actions/publish-docker
        with:
          dockerfile: ./.github/dockerfiles/Dockerfile.prefect
          build_context_path: ./whl
          image_basename: "${{ github.repository_owner }}/prefect"
          image_suffix: /rs-client-libraries/k8s
          version_name: ${{ needs.build-whl.outputs.version_name }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          docker_tag: ${{ needs.set-env.outputs.docker_tag }}
          build_args: |
            K8S_IMAGE=-k8s

  ###########
  # TESTING #
  ###########

  # Test rs-demo with the new Docker images
  test-demo:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    name: "Test rs-demo"
    needs: [set-env, publish-docker-jupyter]
    steps:
      - name: Log into Docker registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: test-demos
        name: "Test rs-demo"
        run: |
          set -x

          # Copy the s3cmd config file to be able to access the "real" s3 bucket
          echo "${{ secrets.S3CFG_OVH_BUCKET }}" > ~/.s3cfg

          # Clone the rs-demo repository
          git clone https://github.com/RS-PYTHON/rs-demo.git

          # Try to checkout in rs-demo the same branch name than in rs-server.
          # If the branch doesn't exist, it's ok, we stay on the default branch.
          cd rs-demo
          git checkout ${{ needs.set-env.outputs.branch_name }} || true
          git status

          # Run the rs-demo local mode using the newly created docker images
          cd local-mode
          docker_tag="${{ needs.set-env.outputs.docker_tag }}"
          docker_tag="${docker_tag:-latest}" # latest by default
          ./test-docker-tag.sh "$docker_tag"
          docker compose -f docker-compose-test-tag.yml up cicd -d
          ./run-notebooks.sh
          docker compose down -v

        shell: bash

  ###########################
  # Trigger other workflows #
  ###########################

  # See https://docs.github.com/en/rest/actions/workflows?apiVersion=2022-11-28#create-a-workflow-dispatch-event
  trigger-rs-infra-core:
    needs: [set-env, test-demo] # this must be the last job to run
    if: (github.actor != 'dependabot[bot]') && (needs.set-env.outputs.branch_name == 'develop')
    runs-on: ubuntu-latest
    name: "Trigger rs-infra-core workflow"
    steps:
      - run: |
          set -x
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.TRIGGER_WORKFLOWS }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/RS-PYTHON/rs-infra-core/actions/workflows/publish-image.yml/dispatches \
            -d '{"ref":"develop","inputs":{"docker_tag":"latest"}}'
        shell: bash
