[project]
name = "rs-client-libraries"
dynamic = ["version"] # see: https://github.com/mtkennerly/poetry-dynamic-versioning

[tool.poetry]
name = "rs-client-libraries"
version = "0.0.0"
description = "Copernicus Sentinel rs-client library and processing workflows."
license = "Apache-2.0"
authors = ["ESA under contract with Airbus and CS <ops_coprs@airbus.com>"]
readme = "README.md"
homepage = "https://home.rs-python.eu/"
repository = "https://github.com/RS-PYTHON/rs-client-libraries"
documentation = "https://home.rs-python.eu/rs-documentation/rs-client-libraries/docs/doc/"
keywords = ["stac", "copernicus", "sentinel", "processing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: OpenTelemetry",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Software Development :: Libraries :: Python Modules"
]

packages = [
    { include = "rs_client" },
    { include = "rs_common" },
    { include = "rs_workflows" },
]

# Add configuration files to the .whl package
include = [
    { path = "config", format = ["wheel"] }
]

[tool.poetry.dependencies]
python = ">=3.11,<3.15"
opentelemetry-distro = "^0.64b0" # then run 'poetry run opentelemetry-bootstrap -a install'
opentelemetry-exporter-otlp = "^1.43.0"
protobuf = ">=5.29.5"
cachetools = ">=5.5.2"
pystac = "^1.13.0"
pystac-client = "^0.9.0"
python-dateutil = "^2.9.0.post0"
stac-pydantic = "^3.4.0"
openapi-core = ">=0.23.1"
click = "8.4.1"
prefect = { version = "3.7.5", extras = ["aws"] }
prefect-aws = ">=0.7.7"
# importlib_metadata required with prefect < 3.7.2 see https://github.com/PrefectHQ/prefect/pull/22012
importlib_metadata = ">=7.0"
requests = "^2.32.4"
urllib3 = ">=2.7.0"
SQLAlchemy = "^2.0.37"
dask-gateway = "2026.3.0"
uv = ">=0.9.7"
psycopg2-binary = ">=2.9.10"
werkzeug = ">=3.1.6"
cryptography = "^48.0.1"
aiohttp = "^3.14.1"

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
pytest-asyncio = "^1.3.0"
pytest-cov = "^7.1.0"
pytest-docker = "^3.2.5"
pytest-error-for-skips = "^2.0.2"
pytest-mock = "^3.15.1"
black = ">=26.3.1"
mypy = "^1.20.2"
pre-commit = "^4.6.0"
bandit = "^1.9.4"
safety = "^3.7.0"
pylint = "^4.0.5"
sphinx = ">=8.1.3"
sphinx-rtd-theme = ">=3.0.2"
flake8 = "^7.3.0"
flake8-pyproject = "^1.2.4"
responses = "^0.26.0"
starlette = "^1.3.1"
pytest-responses = "^0.5.1"
moto = "^5.1.22"
# Dependencies of the standalone rs_workflows/adf_conversion scripts, required to
# unit-test them (tests/test_adf_util.py, tests/test_adf_cop_dem_utils.py).
numpy = ">=1.26"
pandas = ">=2.2"
xarray = ">=2024.9.0"
matplotlib = ">=3.9.0"

[tool.poetry.group.demo.dependencies] # for hybrid mode
jupyterlab = "^4.5.0"
boto3 = "^1.43.0"
papermill = "^2.6.0"
tornado = "^6.5.7" # fix trivy vulnerability

[tool.poetry.requires-plugins]
poetry-dynamic-versioning = { version = ">=1.0.0,<2.0.0", extras = ["plugin"] }

[tool.poetry-dynamic-versioning]
enable = true
metadata = false

[build-system]
requires = ["poetry-core>=1.0.0", "poetry-dynamic-versioning>=1.0.0,<2.0.0"]
build-backend = "poetry_dynamic_versioning.backend"

[tool.black]
line-length = 120
# rs_workflows/adf_conversion is third-party code vendored from the ESA EOPF
# project (https://gitlab.eopf.copernicus.eu/cpm/adf-auxiliary-data-file); it is
# kept as-is and excluded from our QA tooling.
extend-exclude = 'rs_workflows/adf_conversion/'

[tool.pytest.ini_options]
markers = [
    "unit", # mark a test as unittest
    "integration", # mark a test as integration test
]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"

[tool.mypy]
warn_redundant_casts = true
# Force analyze of partially annotate function signatures
check_untyped_defs = true
ignore_missing_imports = true
disable_error_code = ["call-overload"]
# vendored third-party code, see [tool.black] above
exclude = ["rs_workflows/adf_conversion/"]

[tool.flake8]
max-line-length = 120
# vendored third-party code, see [tool.black] above
exclude = ["rs_workflows/adf_conversion/"]
# per-file-ignores = [
#     '__init__.py:F401',
# ]

[tool.pylint.messages_control]
max-line-length=120
disable = [
    "global-statement",
    "import-error",
    "logging-fstring-interpolation",
    "not-context-manager",
    "too-few-public-methods",
    "too-many-arguments",
    "too-many-branches",
    "too-many-locals",
    "too-many-positional-arguments",
    "too-many-statements",
    "too-many-lines",
]

[tool.pylint.MASTER]
ignore-paths = ['^docs/.*$', '^rs_workflows/adf_conversion/.*$']

[tool.pylint.MISCELLANEOUS]
notes = ["XXX"] # no errors on TODO and FIXME

[tool.pylint.SIMILARITIES]
# Minimum lines number of a similarity FIXME.
min-similarity-lines=10

[tool.bandit]
exclude_dirs = ["tests", ".poetry/plugins", "rs_workflows/adf_conversion"]
