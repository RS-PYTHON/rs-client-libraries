[project]
name = "rs-client-libraries"
dynamic = ["version"]
description = "Copernicus Sentinel rs-client library and processing workflows."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "ESA under contract with Airbus and CS", email = "ops_coprs@airbus.com" }]
keywords = ["stac", "copernicus", "sentinel", "processing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: OpenTelemetry",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.13,<3.15"
dependencies = [
    "opentelemetry-distro>=0.66b1,<0.67", # then run 'uv run opentelemetry-bootstrap -a install'
    "opentelemetry-exporter-otlp>=1.45.1,<2",
    "protobuf>=5.29.5",
    "cachetools>=5.5.2",
    "pystac>=1.13.0,<2",
    "pystac-client>=0.9.0,<0.10",
    "python-dateutil>=2.9.0.post0,<3",
    "stac-pydantic>=3.4.0,<4",
    "openapi-core>=0.23.1",
    "click==8.4.1",
    "prefect[aws]==3.9.1",
    "prefect-aws>=0.7.7",
    # prefect 3.8.x server is incompatible with fastapi >= 0.151 (explicit JSON null no longer
    # replaced by the Body default: 422 on /filter, /count, /paginate... routes),
    # see https://github.com/PrefectHQ/prefect/pull/23478. prefect >= 3.9.0 caps fastapi < 0.151 itself.
    # Remove this pin when prefect supports newer fastapi.
    "fastapi<0.151",
    # importlib_metadata required with prefect < 3.7.2 see https://github.com/PrefectHQ/prefect/pull/22012
    "importlib_metadata>=7.0",
    "requests>=2.32.4,<3",
    "urllib3>=2.7.0",
    "SQLAlchemy>=2.0.37,<3",
    "dask-gateway==2026.3.0",
    "uv>=0.9.7",
    "psycopg2-binary>=2.9.10",
    "werkzeug>=3.1.6",
    "cryptography>=50.0.0,<51",
    "aiohttp>=3.14.3,<4",
    "antimeridian>=0.4.7,<0.6",
    "pyproj>=3.7.2,<4",
    "zarr>=3,<4",
    "dpath>=2.2.0,<3",
    "numpy>=1.26",
    "xarray>=2025.3.1",
]

[project.urls]
Homepage = "https://home.rs-python.eu/"
Repository = "https://github.com/RS-PYTHON/rs-client-libraries"
Documentation = "https://home.rs-python.eu/rs-documentation/rs-client-libraries/docs/doc/"

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=1.3.0,<2",
    "pytest-cov>=7.1.0,<8",
    "pytest-docker>=3.2.5,<4",
    "pytest-error-for-skips>=2.0.2,<3",
    "pytest-mock>=3.15.1,<4",
    "black>=26.3.1",
    "mypy>=1.20.2,<3",
    "pre-commit>=4.6.0,<5",
    "bandit>=1.9.4,<2",
    "pylint>=4.0.5,<5",
    "sphinx>=8.1.3",
    "sphinx-rtd-theme>=3.0.2",
    "flake8>=7.3.0,<8",
    "flake8-pyproject>=1.2.4,<2",
    "responses>=0.26.0,<0.27",
    "starlette>=1.3.1,<2",
    "pytest-responses>=0.5.1,<0.7",
    "moto>=5.1.22,<6",
    # Dependencies of the standalone rs_workflows/adf_conversion scripts, required to
    # unit-test them (tests/test_adf_util.py, tests/test_adf_cop_dem_utils.py).
    "pandas>=2.2",
    "matplotlib>=3.9.0",
]
# To run the demo notebooks
demo = [
    "jupyterlab>=4.5.0,<5",
    "boto3>=1.43.0,<2",
    "papermill>=2.6.0,<3",
    "tornado>=6.5.7,<7", # fix trivy vulnerability
]

[tool.uv]
default-groups = ["dev", "demo"] # installed by 'uv sync'
# Rebuild the package metadata (version) when the git commit or tags change
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

[build-system]
requires = ["hatchling>=1.33.0", "uv-dynamic-versioning>=0.14.1"]
build-backend = "hatchling.build"

# The version is calculated from the git tags, see: https://github.com/ninoseki/uv-dynamic-versioning
[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
metadata = false
fallback-version = "0.0.0" # when git is not available e.g. for Dependabot

[tool.hatch.build.targets.wheel]
packages = ["rs_client", "rs_common", "rs_workflows"]

# Add configuration files to the .whl package
[tool.hatch.build.targets.wheel.force-include]
"config" = "config"

[tool.black]
line-length = 120
# rs_workflows/adf_conversion is third-party code vendored from the ESA EOPF
# projects (CPM ADF auxiliary-data-file and S1 L1 ADF converter); it is
# kept as-is and excluded from our QA tooling.
extend-exclude = 'rs_workflows/adf_conversion/'

[tool.pytest.ini_options]
markers = [
    "unit", # mark a test as unittest
    "integration", # mark a test as integration test
]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"

[tool.mypy]
warn_redundant_casts = true
# Force analyze of partially annotate function signatures
check_untyped_defs = true
ignore_missing_imports = true
disable_error_code = ["call-overload"]
# vendored third-party code, see [tool.black] above
exclude = ["rs_workflows/adf_conversion/"]

[tool.flake8]
max-line-length = 120
# vendored third-party code, see [tool.black] above
extend-exclude = ["rs_workflows/adf_conversion/", ".poetry/"]
# per-file-ignores = [
#     '__init__.py:F401',
# ]

[tool.pylint.messages_control]
max-line-length=120
disable = [
    "global-statement",
    "import-error",
    "logging-fstring-interpolation",
    "not-context-manager",
    "too-few-public-methods",
    "too-many-arguments",
    "too-many-branches",
    "too-many-locals",
    "too-many-positional-arguments",
    "too-many-statements",
    "too-many-lines",
]

[tool.pylint.MASTER]
ignore-paths = ['^docs/.*$', '^rs_workflows/adf_conversion/.*$']

[tool.pylint.MISCELLANEOUS]
notes = ["XXX"] # no errors on TODO and FIXME

[tool.pylint.SIMILARITIES]
# Minimum lines number of a similarity FIXME.
min-similarity-lines=10

[tool.bandit]
exclude_dirs = ["tests", "rs_workflows/adf_conversion"]
