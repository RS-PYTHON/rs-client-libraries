version: '3.0'

scanning-settings:
  max-depth: 6
  exclude: []
  include-files: []
  system:
    targets: []


report:
  dependency-vulnerabilities:
    enabled: true
    auto-ignore-in-report:
      python:
        environment-results: true
        unpinned-requirements: true
      cvss-severity: []
      vulnerabilities:
        # All nltk vulnerabilities - transitive dep of safety dev tool only,
        # not used at runtime by this project. No known fix for any nltk version.
        # https://platform.safetycli.com/codebases/rs-client-libraries/findings?branch=HEAD
        SFTY-20260616-58930:
          reason: "HIGH - Path traversal in data.load(), not used in this project"
          expires: "2099-12-31"
        SFTY-20260731-71411:
          reason: "MEDIUM - SSRF via DNS rebinding, not used in this project"
          expires: "2099-12-31"
        SFTY-20260731-74449:
