---
# Welcome to your prefect.yaml file! You can use this file for
# storing and managing configuration for deploying your flows.
# We recommend committing this file to source control along
# with your flow code.

# Generic metadata about this project
name: rs-client-libraries
prefect-version: 3.6.20

# build section allows you to manage and build docker images
build: null

# push section allows you to manage if and how this project
# is uploaded to remote locations
push: null

# pull section allows you to provide instructions for cloning
# this project in remote locations
pull:
- prefect.deployments.steps.git_clone:
    repository: https://github.com/RS-PYTHON/rs-client-libraries
    branch: feat/rspy1025-new-s1-ard

# the deployments section allows you to provide configuration
# for deploying flows
deployments:
- name: On-demand processing
  tags: [on-demand, processing]
  description: |-
    Generic processing flow. Not meant to be called directly.
  entrypoint: rs_workflows/on_demand_processing.py:dpr_processing
  work_pool:
    name: eopf-prefect-pool
    work_queue_name: null
    job_variables: {}
  schedules: []
- name: Process S1 ARD
  version: null
  tags: [processing, s1, ard]
  concurrency_limit: null
  description: |-
    Sentinel-1 ARD processing.
    The SLC products should have been staged before.
  entrypoint: rs_workflows/on_demand/sentinel1/s1_ard.py:process_s1ard
  parameters: {}
  work_pool:
    name: eopf-prefect-pool
    work_queue_name: null
    job_variables: {}
  schedules: []
- name: Process S1 ARD Reference
  version: null
  tags: [processing, s1, ard]
  concurrency_limit: null
  description: |-
    Sentinel-1 ARD processing reference pipeline.
    This flow must be run once to generate the REFERENCE_DB used in on-demand S1 ARD processing flow.
  entrypoint: rs_workflows/on_demand/sentinel1/s1_ard.py:process_s1ard_reference
  parameters: {}
  work_pool:
    name: eopf-prefect-pool
    work_queue_name: null
    job_variables: {}
  schedules: []
