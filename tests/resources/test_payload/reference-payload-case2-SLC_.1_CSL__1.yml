general_configuration:
  logging__progress_level: INFO
  triggering__wait_before_exit: 10
  triggering__temporary_shared: false
workflow:
- name: Calibration.1
  active: true
  validate: false
  module: s1_ard.computing.ard_processing_units
  processing_unit: Calibration
  inputs:
    slcs: slcs
  adfs:
    ETAD: ETAD
    ORBIT: ORBIT
  parameters:
    reference_date: '2023-10-03'
- name: ReferenceDEM.2
  active: true
  validate: false
  module: s1_ard.computing.ard_processing_units
  processing_unit: ReferenceDEM
  inputs:
    slcs: Calibration.1.slcs
  outputs:
    DEM: DEM
  adfs:
    DEM: DEM
- name: ReferenceGeometry.3
  active: true
  validate: false
  module: s1_ard.computing.ard_processing_units
  processing_unit: ReferenceGeometry
  inputs:
    slcs: Calibration.1.slcs
    dem: ReferenceDEM.2.DEM
  outputs:
    simulation_ref: simulation_ref
- name: coregistration.4
  active: true
  validate: false
  module: s1_ard.computing.ard_processing_units
  processing_unit: coregistration
  inputs:
    slcs: Calibration.1.slcs
    dem: ReferenceDEM.2.DEM
    simulation_ref: ReferenceGeometry.3.simulation_ref
  outputs:
    cslcs: cslcs
io:
  input_products:
  - id: slcs
    path: s3://test-bucket/S1CADUS
    type: file
    engine: cpm_zarr
    reader_params:
      storage_options:
        key: testing
        secret: testing
        client_kwargs:
          endpoint_url: https://localhost:5000
          region_name: us-east-1
  output_products:
  - id: DEM
    path: /my_share_directory/here/00000000-0000-0000-0000-000000000001
    engine: cpm_zarr
    type: file
    apply_eoqc: false
  - id: cslcs
    path: s3:/rs-dev-cluster-catalog/toto/s01siwclc/00000000-0000-0000-0000-000000000001
    engine: cpm_zarr
    writer_params:
      storage_options:
        key: testing
        secret: testing
        client_kwargs:
          endpoint_url: https://localhost:5000
          region_name: us-east-1
    type: file
    apply_eoqc: false
  - id: simulation_ref
    path: /my_share_directory/here/00000000-0000-0000-0000-000000000001
    engine: cpm_zarr
    type: folder
    apply_eoqc: false
  adfs:
  - id: DEM
    path: s3://mock-bucket/DCS_01_S1A_20200105072204051312_ch1_DSDB_00000.raw.bin
    adf_params:
      storage_options:
        key: testing
        secret: testing
        client_kwargs:
          endpoint_url: https://localhost:5000
          region_name: us-east-1
  - id: ETAD
    path: s3://mock-bucket
    adf_params:
      storage_options:
        key: testing
        secret: testing
        client_kwargs:
          endpoint_url: https://localhost:5000
          region_name: us-east-1
  - id: ORBIT
    path: s3://mock-bucket
    adf_params:
      storage_options:
        key: testing
        secret: testing
        client_kwargs:
          endpoint_url: https://localhost:5000
          region_name: us-east-1
context_managers: []
dask_config:
  distributed.worker.local_directory: ~/eopf/output
