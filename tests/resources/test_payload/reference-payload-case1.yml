general_configuration:
  logging__progress_level: INFO
  triggering__wait_before_exit: 10
  triggering__temporary_shared: false
external_modules:
- name: l0.cadu_processing.cadu_reader
  star_import: true
workflow:
- name: S1L0Processor.1
  active: true
  validate: false
  module: l0.s1.s1_l0_processor
  processing_unit: S1L0Processor
  inputs:
    S1CADUS: S1CADUS
  outputs:
    ^datatakeid_.*: S01SARRAW
    ^gps$: S01GPSRAW
    ^hktm$: S01HKMRAW
    ^ais_.*: S01AISRAW
  adfs:
    osf: osf
    fro: fro
  parameters:
    streaming_mode: false
    temporary_path: ./tmp
    isp_extraction_batch_size: 5
    acquisition_report_output_path: ./acq_report
io:
  input_products:
  - id: S1CADUS
    path: s3://test-bucket/S1CADUS
    type: folder
    engine: cadu
    reader_params:
      storage_options:
        key: testing
        secret: testing
        client_kwargs:
          endpoint_url: https://localhost:5000
          region_name: us-east-1
  output_products:
  - id: S01AISRAW
    path: s3:/rs-dev-cluster-catalog/toto/s01aisraw/00000000-0000-0000-0000-000000000001
    engine: cpm_zarr
    writer_params:
      storage_options:
        key: testing
        secret: testing
        client_kwargs:
          endpoint_url: https://localhost:5000
          region_name: us-east-1
      mode: w
    type: folder
    apply_eoqc: false
  - id: S01GPSRAW
    path: s3:/rs-dev-cluster-catalog/toto/s01gpsraw/00000000-0000-0000-0000-000000000001
    engine: cpm_zarr
    writer_params:
      storage_options:
        key: testing
        secret: testing
        client_kwargs:
          endpoint_url: https://localhost:5000
          region_name: us-east-1
      mode: w
    type: folder
    apply_eoqc: false
  - id: S01HKMRAW
    path: s3:/rs-dev-cluster-catalog/toto/s01hkmraw/00000000-0000-0000-0000-000000000001
    engine: cpm_zarr
    writer_params:
      storage_options:
        key: testing
        secret: testing
        client_kwargs:
          endpoint_url: https://localhost:5000
          region_name: us-east-1
      mode: w
    type: folder
    apply_eoqc: false
  - id: S01SARRAW
    path: s3:/rs-dev-cluster-catalog/toto/s01sarraw/00000000-0000-0000-0000-000000000001
    engine: cpm_zarr
    writer_params:
      storage_options:
        key: testing
        secret: testing
        client_kwargs:
          endpoint_url: https://localhost:5000
          region_name: us-east-1
      mode: w
      default_codec: None
      encoding:
        /measurement/radiance/Oa01: None
        /measurement/radiance/Oa02: '!ZarrCompressor'
        cname: zstd
        clevel: 3
        shuffle: 2
        blocksize: 0
    type: folder
    apply_eoqc: false
  adfs:
  - id: fro
    path: s3://mock-bucket/DCS_01_S1A_20200105072204051312_ch1_DSDB_00000.raw.bin
    adf_params:
      storage_options:
        key: testing
        secret: testing
        client_kwargs:
          endpoint_url: https://localhost:5000
          region_name: us-east-1
  - id: osf
    path: s3://mock-bucket/DCS_01_S1A_20200105072204051312_ch1_DSDB_00000.raw.bin
    adf_params:
      storage_options:
        key: testing
        secret: testing
        client_kwargs:
          endpoint_url: https://localhost:5000
          region_name: us-east-1
context_managers: []
dask_config:
  distributed.worker.local_directory: ~/eopf/output
